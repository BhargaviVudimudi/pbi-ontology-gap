relationships:
  # Power BI has no named relationships, so the names below were proposed
  # from what each join points at. They are a starting point: replace any
  # that does not say what the link actually means.

  salesForCustomer:  # proposed
    from: Sales
    to: Customer
    cardinality: many_to_one
    via: Sales.CustomerKey = Customer.CustomerKey

  hasProduct:  # proposed
    from: Sales
    to: Product
    cardinality: many_to_one
    via: Sales.ProductKey = Product.ProductKey

  onOrderDate:  # proposed
    from: Sales
    to: Date
    cardinality: many_to_one
    via: Sales.OrderDate = Date.DateKey

  onShipDate:  # proposed
    from: Sales
    to: Date
    cardinality: many_to_one
    via: Sales.ShipDate = Date.DateKey
    active: false  # an alternate path somebody chose not to use

  byEmployee:  # proposed
    from: Sales
    to: Employee
    cardinality: many_to_one
    via: Sales.EmployeeKey = Employee.EmployeeKey

  inCategory:  # proposed
    from: Product
    to: Category
    cardinality: many_to_one
    via: Product.CategoryKey = Category.CategoryKey

  hasManager:  # proposed
    from: Employee
    to: Employee
    cardinality: many_to_one
    via: Employee.ManagerKey = Employee.EmployeeKey
    active: false  # an alternate path somebody chose not to use

  budgetForCustomer:  # proposed
    from: Budget
    to: Customer
    cardinality: many_to_many
    via: Budget.SegmentCode = Customer.SegmentCode
    crossfilter: bothDirections  # ambiguous, resolve explicitly

measures:

  Revenue:
    definition: TODO
    home_table: Sales
    formula_dax: "CALCULATE ( SUM ( Sales[Amount] ), Sales[OrderStatus] = \"Confirmed\" )"
    filters: "counts only rows where OrderStatus is \"Confirmed\""  # derived from the DAX
    owner: TODO who signs off on this definition

  Total Revenue:
    definition: TODO
    home_table: Sales
    formula_dax: "CALCULATE(SUM(Sales[Amount]), Sales[OrderStatus] = \"Confirmed\")"
    filters: "counts only rows where OrderStatus is \"Confirmed\""  # derived from the DAX
    owner: TODO who signs off on this definition

  Net Revenue:
    definition: "Revenue after discount, confirmed orders only, excluding discontinued lines."
    home_table: Sales
    formula_dax: "CALCULATE ( SUMX ( Sales, Sales[Amount] * ( 1 - Sales[Discount] ) ), Sales[OrderStatus] = \"Confirmed\", Product[DiscontinuedFlag] = 0 )"
    filters: "counts only rows where OrderStatus is \"Confirmed\"; counts only rows where DiscontinuedFlag is 0"  # derived from the DAX
    owner: TODO who signs off on this definition

  Cost of Sales:
    definition: TODO
    home_table: Sales
    formula_dax: "CALCULATE ( SUM ( Sales[Cost] ), Sales[OrderStatus] IN { \"Confirmed\", \"Shipped\" } )"
    filters: "counts only rows where OrderStatus is one of \"Confirmed\", \"Shipped\""  # derived from the DAX
    owner: TODO who signs off on this definition

  Gross Margin:
    definition: TODO
    home_table: Sales
    formula_dax: "[Net Revenue] - [Cost of Sales]"
    filters: none found in the DAX
    built_from: [Cost of Sales, Net Revenue]
    owner: TODO who signs off on this definition

  Gross Margin %:
    definition: TODO
    home_table: Sales
    formula_dax: "DIVIDE ( [Gross Margin], [Net Revenue], 0 )"
    filters: none found in the DAX
    built_from: [Gross Margin, Net Revenue]
    owner: TODO who signs off on this definition

  Margin Variance %:
    definition: TODO
    home_table: Sales
    formula_dax: "DIVIDE ( SUM ( Sales[Amount] ) - SUM ( Sales[Cost] ), SUM ( Sales[Cost] ), 0 )"
    filters: none found in the DAX
    owner: TODO who signs off on this definition

  Shipped Revenue:
    definition: TODO
    home_table: Sales
    formula_dax: "CALCULATE ( [Revenue], USERELATIONSHIP ( Sales[ShipDate], 'Date'[DateKey] ) )"
    filters: "USERELATIONSHIP, activates an inactive relationship"  # derived from the DAX
    built_from: [Revenue]
    owner: TODO who signs off on this definition

  FY24 Baseline:
    definition: TODO
    home_table: Sales
    formula_dax: "CALCULATE ( [Revenue], 'Date'[DateKey] >= DATE ( 2024, 4, 1 ) )"
    filters: "hardcoded year 2024"  # derived from the DAX
    built_from: [Revenue]
    owner: TODO who signs off on this definition

  Order Count:
    definition: TODO
    home_table: Sales
    formula_dax: "DISTINCTCOUNT ( Sales[SalesKey] )"
    filters: none found in the DAX
    owner: TODO who signs off on this definition

  Budget Amount:
    definition: TODO
    home_table: Budget
    formula_dax: "SUM ( Budget[BudgetAmount] )"
    filters: none found in the DAX
    owner: TODO who signs off on this definition

value_sets:
  # Every literal the model compares each column against. This is the set
  # of values the numbers actually depend on. Anything outside it is
  # silently excluded, which is why it belongs in the ontology.

  OrderStatus:
    values: ["Confirmed", "Shipped"]
    relied_on_by: [Cost of Sales, Net Revenue, Revenue, Total Revenue]
    closed: TODO can a new value appear in the source? who approves it?

constraints:
  # Generated from evidence in the model. Each one is proposed: it states
  # what the model already assumes, not what anybody has agreed to.

  - id: orderstatus_observed_values
    observed: OrderStatus is only ever compared against ['Confirmed', 'Shipped'],
      by 4 measures.
    # That is what the model does, not what must be true. One of these
    # holds, and only a person can say which:
    #   a) these are the only valid values, anything else is a data error
    #   b) other values exist and are deliberately excluded
    #   c) other values exist and are being dropped by accident
    check_first: run a distinct on the source OrderStatus. Any value not in the
      list above is counted by no measure at all.
    rule: TODO write it once a) b) or c) is settled
    severity: error
    status: proposed

  - id: margin_variance_filter_check
    rule: Margin Variance % aggregates Sales[Amount], Sales[Cost] but applies no
      filter on OrderStatus, unlike Cost of Sales, Net Revenue, Revenue, Total Revenue.
    because: a measure in a family that skips the family's filter usually
      returns a number that does not mean what its name says.
    severity: error
    status: proposed, needs a human to confirm whether it is deliberate

